services:
  proposal-reviewer:
    build: .
    # docker compose build && docker compose push  ->  Docker Hub
    image: mstarman/knmfi-proposalreviewer:0.0.1
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      # edit skills and config without rebuilding the image
      - ./skills:/app/skills
      - ./config.yaml:/app/config.yaml:ro
      # custom base system prompt: put it at ./prompts/system_prompt.md
      - ./prompts:/app/prompts:ro
